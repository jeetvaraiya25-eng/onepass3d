<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>3D scene</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; outline: none; }
      #progress { position: absolute; top: 0; height: 4px; background: #c4f542; z-index: 9; width: 0; pointer-events: none; }
      #message { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #ff7a6a; font: 600 16px sans-serif; pointer-events: none; padding: 24px; text-align: center; }
      #spinner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #c4f542; font: 500 14px sans-serif; pointer-events: none; }
      #fps, #camid { display: none; }
      #pad {
        display: none;
        position: absolute;
        left: 16px;
        bottom: 22px;
        width: 116px;
        height: 116px;
        z-index: 12;
        touch-action: none;
      }
      #pad .base {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.22);
        background: rgba(8,10,14,0.45);
      }
      #knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border-radius: 50%;
        background: rgba(201,242,75,0.92);
        box-shadow: 0 0 18px rgba(201,242,75,0.35);
        pointer-events: none;
      }
      @media (pointer: coarse) {
        #pad { display: block; }
      }
    </style>
  </head>
  <body>
    <div id="progress"></div>
    <div id="message"></div>
    <div id="spinner">Loading the scene…</div>
    <canvas id="canvas" tabindex="0"></canvas>
    <div id="pad" hidden>
      <div class="base"></div>
      <div id="knob"></div>
    </div>
    <div id="quality"><span id="fps"></span></div>
    <div id="caminfo"><span id="camid"></span></div>
    <script src="main.js?v=23"></script>
  </body>
</html>
